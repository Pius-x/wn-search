<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6fed">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="网盘搜索">
<title>网盘搜索器</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<script>
  try {
    if (localStorage.getItem("searcher.unlocked") === "1") {
      document.documentElement.classList.add("unlocked");
    }
  } catch (e) {}
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232f6fed'/%3E%3Ccircle cx='45' cy='45' r='20' fill='none' stroke='white' stroke-width='9'/%3E%3Cpath d='M60 60 L78 78' stroke='white' stroke-width='9' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --text: #16181d;
    --muted: #727985;
    --border: #e3e5ea;
    --accent: #2f6fed;
    --accent-weak: #eaf0ff;
    --ok: #0f7b45;
    --ok-weak: rgba(15, 157, 88, .12);
    --warn: #b45309;
    --warn-weak: rgba(217, 119, 6, .14);
    --danger: #e5484d;
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 4px 12px rgba(16,24,40,.05);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1013;
      --surface: #171a1f;
      --text: #e9ecf1;
      --muted: #8b93a1;
      --border: #262b33;
      --accent: #7aa2ff;
      --accent-weak: #1a2436;
      --ok: #4ade80;
      --ok-weak: rgba(74, 222, 128, .12);
      --warn: #fbbf24;
      --warn-weak: rgba(251, 191, 36, .14);
      --danger: #ff6b6f;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  [hidden] { display: none !important; }
  .wrap {
    max-width: 680px; margin: 0 auto;
    padding: 24px 16px calc(56px + env(safe-area-inset-bottom));
  }

  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  h1 { font-size: 20px; font-weight: 600; letter-spacing: .2px; margin: 0; }

  .searchbar {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 6px 6px 6px 14px; box-shadow: var(--shadow);
    transition: border-color .15s, box-shadow .15s;
  }
  .searchbar:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-weak); }
  .searchbar svg { flex: none; color: var(--muted); }
  #kw {
    flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
    color: var(--text); font-size: 16px; padding: 10px 0;
  }
  #kw::placeholder { color: var(--muted); }
  .go {
    flex: none; border: 0; border-radius: 10px; background: var(--accent); color: #fff;
    font-size: 14px; font-weight: 500; padding: 10px 16px; cursor: pointer;
  }
  .go:active { opacity: .85; }

  .search-compact {
    display: flex; align-items: center; gap: 8px; width: 100%;
    background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
    padding: 9px 14px; box-shadow: var(--shadow); margin-bottom: 14px;
    color: var(--text); font: inherit; font-size: 14px; cursor: pointer; text-align: left;
  }
  .search-compact:hover { border-color: var(--accent); }
  .search-compact svg { flex: none; color: var(--muted); }
  .sc-kw {
    font-weight: 500; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .sc-hint { flex: none; margin-left: auto; color: var(--muted); font-size: 12px; }

  .recent { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 2px 0; }
  .chip {
    border: 0; background: transparent; color: var(--muted); font-size: 13px;
    padding: 4px 9px; border-radius: 8px; cursor: pointer;
  }
  .chip:hover { background: var(--accent-weak); color: var(--accent); }
  .chip.clear { opacity: .75; text-decoration: underline; text-underline-offset: 2px; }

  .toggle {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--muted); cursor: pointer; user-select: none;
  }
  .toggle input { width: 15px; height: 15px; accent-color: var(--accent); margin: 0; }
  .ghost-btn {
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    font-size: 13px; padding: 6px 12px; border-radius: 9px; cursor: pointer;
    transition: border-color .15s, color .15s;
  }
  .ghost-btn:hover { border-color: var(--accent); color: var(--accent); }

  .sidebar { display: none; }
  .side-filter {
    width: 100%; border: 1px solid var(--border); border-radius: 9px;
    background: transparent; color: var(--text); font-size: 13px;
    padding: 8px 10px; outline: 0;
  }
  .side-filter:focus { border-color: var(--accent); }
  .side-list {
    display: flex; flex-direction: column; gap: 2px;
    min-height: 0; overflow-y: auto; padding-right: 2px;
  }
  .side-foot {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding-top: 8px; border-top: 1px solid var(--border);
  }
  .side-foot .toggle { white-space: nowrap; }

  .preview-empty {
    display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    padding: 24px; text-align: center; color: var(--muted); font-size: 13px;
    border: 1px dashed var(--border); border-radius: var(--radius);
    background: var(--surface);
  }
  .preview-empty p { margin: 0; }

  .sheet-backdrop {
    position: fixed; inset: 0; z-index: 65;
    background: rgba(0, 0, 0, .38);
  }

  .site-bar { position: relative; display: flex; align-items: center; gap: 8px; margin: 16px 0 12px; }
  .site-strip {
    flex: 1; min-width: 0; display: flex; gap: 8px;
    overflow-x: auto; scrollbar-width: none; padding: 2px 0 4px;
    -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 18px), transparent);
    mask-image: linear-gradient(to right, #000 calc(100% - 18px), transparent);
  }
  .site-strip::-webkit-scrollbar { display: none; }
  .site-chip {
    flex: none; display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    font-size: 13px; padding: 7px 12px; border-radius: 999px; cursor: pointer;
    white-space: nowrap; transition: border-color .15s, background .15s, color .15s;
  }
  .site-chip:hover { border-color: var(--accent); }
  .site-chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .site-chip .dot { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--border); }
  .site-chip .dot.free { background: var(--ok); }
  .site-chip .dot.paid { background: var(--warn); }
  .site-chip.active .dot { background: rgba(255, 255, 255, .85); }
  .empty-strip { flex: none; color: var(--muted); font-size: 13px; padding: 7px 4px; }

  .more-btn {
    flex: none; display: inline-flex; align-items: center; gap: 4px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    font-size: 13px; padding: 7px 12px; border-radius: 999px; cursor: pointer;
    white-space: nowrap; transition: border-color .15s, color .15s;
  }
  .more-btn:hover, .more-btn[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }
  .more-btn .caret {
    width: 0; height: 0; display: inline-block;
    border-left: 4px solid transparent;
    border-right: 4px solid transparent;
    border-top: 5px solid currentColor;
  }

  .more-panel {
    position: fixed; left: 10px; right: 10px;
    bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 70;
    display: flex; flex-direction: column; gap: 8px;
    max-height: 72dvh; padding: 12px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 18px; box-shadow: 0 -8px 40px rgba(0, 0, 0, .25);
  }
  body.sheet-lock { overflow: hidden; }
  .sheet-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 2px 2px; font-size: 13px; font-weight: 600;
  }
  .sheet-close {
    border: 0; background: transparent; color: var(--muted);
    font-size: 20px; line-height: 1; padding: 0 4px; cursor: pointer;
  }
  .sheet-close:hover { color: var(--text); }
  .more-panel input {
    width: 100%; border: 1px solid var(--border); border-radius: 9px;
    background: transparent; color: var(--text); font-size: 13px;
    padding: 8px 10px; outline: 0;
  }
  .more-panel input:focus { border-color: var(--accent); }
  .more-list { min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  .more-item {
    display: flex; align-items: center; gap: 8px; width: 100%;
    border: 0; background: transparent; color: var(--text); text-align: left;
    padding: 7px 8px; border-radius: 8px; cursor: pointer; font: inherit;
  }
  .more-item:hover { background: var(--accent-weak); }
  .more-item.current { background: var(--accent-weak); }
  .mi-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .mi-name { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mi-host { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .more-foot {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding-top: 8px; border-top: 1px solid var(--border);
  }
  .more-foot .toggle { white-space: nowrap; }

  .badge {
    flex: none; font-size: 10px; line-height: 1.5; padding: 0 6px; border-radius: 999px;
    font-weight: 500;
  }
  .badge.free { color: var(--ok); background: var(--ok-weak); }
  .badge.paid { color: var(--warn); background: var(--warn-weak); }
  .badge.last { color: var(--accent); background: var(--accent-weak); }
  .del {
    flex: none; width: 28px; height: 28px;
    border: 0; border-radius: 8px; background: transparent; color: var(--muted);
    cursor: pointer; font-size: 16px; line-height: 1;
    display: flex; align-items: center; justify-content: center; opacity: .55;
  }
  .del:hover { background: var(--accent-weak); color: var(--danger); opacity: 1; }

  .preview {
    margin-top: 0; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); overflow: hidden;
  }
  .preview-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    flex-wrap: wrap; padding: 10px 12px; border-bottom: 1px solid var(--border);
  }
  .preview-title { display: flex; align-items: center; gap: 8px; min-width: 0; font-weight: 600; }
  .preview-title .pname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .preview-keyword { color: var(--muted); font-weight: 400; font-size: 12px; white-space: nowrap; }
  .preview-status { color: var(--muted); font-weight: 400; font-size: 11px; white-space: nowrap; }
  .preview-actions { display: flex; gap: 6px; flex: none; }
  .preview-actions button {
    border: 1px solid var(--border); background: transparent; color: var(--text);
    font-size: 12px; padding: 5px 9px; border-radius: 8px; cursor: pointer;
    transition: border-color .15s, color .15s;
  }
  .preview-actions button:hover { border-color: var(--accent); color: var(--accent); }
  .preview-actions .icon { width: 30px; padding: 5px 0; text-align: center; }

  .preview-body {
    position: relative; background: #fff;
    height: clamp(380px, 68vh, 720px);
    height: clamp(380px, 68dvh, 720px);
  }
  .preview-body iframe { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
  .preview-loading {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    gap: 10px; background: var(--surface); color: var(--muted); font-size: 13px;
  }
  .spinner {
    width: 16px; height: 16px; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .preview-blocked {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px; padding: 24px;
    text-align: center; background: var(--surface);
  }
  .preview-blocked p { margin: 0; color: var(--muted); font-size: 13px; max-width: 420px; }
  .preview-blocked .big {
    border: 0; border-radius: 10px; background: var(--accent); color: #fff;
    padding: 10px 18px; font-size: 14px; cursor: pointer;
  }
  .preview.fullscreen {
    position: fixed; inset: 0; margin: 0; border-radius: 0; z-index: 60;
    display: flex; flex-direction: column;
  }
  .preview.fullscreen .preview-body { flex: 1; height: auto; }
  body.preview-lock { overflow: hidden; }

  @media (max-width: 899px) {
    html, body { height: 100%; }
    body { overflow: hidden; }
    .wrap {
      height: 100dvh; max-width: none;
      padding: 10px 0 env(safe-area-inset-bottom);
      display: flex; flex-direction: column; overflow: hidden;
    }
    header { padding: 0 14px; margin-bottom: 10px; flex: none; }
    .searchbar { margin: 0 10px; flex: none; }
    .recent { padding: 0 14px; flex: none; }
    .search-compact { width: auto; margin: 0 10px 10px; flex: none; }
    .site-bar { padding: 0 10px; margin: 6px 0 10px; flex: none; }
    .preview {
      flex: 1; min-height: 0; margin: 0;
      display: flex; flex-direction: column;
      border-left: 0; border-right: 0; border-bottom: 0;
      border-radius: 0; box-shadow: none;
    }
    .preview-body { flex: 1; height: auto; min-height: 0; }
    .preview-empty { flex: 1; border-radius: 0; }
  }

  .gate {
    position: fixed; inset: 0; z-index: 200;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; background: var(--bg);
  }
  html.unlocked .gate { display: none; }
  .gate-card {
    width: min(360px, 100%); text-align: center;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 18px; padding: 28px 24px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, .12);
  }
  .gate-icon { font-size: 26px; margin-bottom: 8px; }
  .gate-card h2 { margin: 0 0 6px; font-size: 18px; }
  .gate-card p { margin: 0 0 16px; color: var(--muted); font-size: 13px; }
  .gate-card input {
    width: 100%; border: 1px solid var(--border); border-radius: 10px;
    background: transparent; color: var(--text); font-size: 15px;
    padding: 11px 12px; outline: 0; margin-bottom: 10px; text-align: center;
  }
  .gate-card input:focus { border-color: var(--accent); }
  .gate-card button {
    width: 100%; border: 0; border-radius: 10px; background: var(--accent);
    color: #fff; font-size: 15px; padding: 11px 12px; cursor: pointer;
  }
  .gate-err { min-height: 18px; margin-top: 10px; color: var(--danger); font-size: 12px; }

  .toast {
    position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(10px);
    background: var(--text); color: var(--bg); font-size: 13px;
    padding: 9px 16px; border-radius: 999px; opacity: 0; pointer-events: none;
    transition: opacity .18s, transform .18s; max-width: 86vw; text-align: center;
  }
  .toast.show { opacity: .95; transform: translateX(-50%) translateY(0); }

  @media (min-width: 900px) {
    html, body { height: 100%; }
    body { overflow: hidden; }
    .wrap {
      height: 100dvh;
      max-width: 1320px;
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      grid-template-rows: auto auto auto minmax(0, 1fr);
      column-gap: 20px;
      padding: 18px 24px 18px;
    }
    header { grid-column: 1 / -1; margin-bottom: 12px; }
    .searchbar { grid-column: 1 / -1; }
    .search-compact { grid-column: 1 / -1; }
    .recent { grid-column: 1 / -1; margin-top: 8px; }
    .sidebar {
      display: flex; flex-direction: column; gap: 10px;
      grid-column: 1; grid-row: 4; min-height: 0;
    }
    .side-list { flex: 1; min-height: 0; }
    .site-bar { display: none; }
    .more-panel { display: none !important; }
    .sheet-backdrop { display: none !important; }
    .preview {
      grid-column: 2; grid-row: 4; min-height: 0;
      display: flex; flex-direction: column;
    }
    .preview-body { flex: 1; height: auto; min-height: 0; }
    .preview-empty {
      display: flex; grid-column: 2; grid-row: 4;
    }
  }
</style>
</head>
<body>
<div class="gate" id="gate">
  <div class="gate-card">
    <div class="gate-icon">🔒</div>
    <h2>需要访问密钥</h2>
    <p>输入密钥后进入搜索器</p>
    <input id="gateKey" type="password" placeholder="密钥" autocomplete="current-password" enterkeyhint="go">
    <button type="button" id="gateBtn">进入</button>
    <div class="gate-err" id="gateErr"></div>
  </div>
</div>

<div class="wrap">
  <header>
    <h1>网盘搜索器</h1>
  </header>

  <div class="searchbar">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <circle cx="11" cy="11" r="7"></circle>
      <path d="m20 20-3.5-3.5"></path>
    </svg>
    <input id="kw" type="search" placeholder="输入关键词，回车搜索" autocomplete="off" enterkeyhint="search">
    <button class="go" id="go">搜索</button>
  </div>

  <div class="recent" id="recent" aria-label="最近搜索"></div>

  <button type="button" class="search-compact" id="searchCompact" hidden>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <circle cx="11" cy="11" r="7"></circle>
      <path d="m20 20-3.5-3.5"></path>
    </svg>
    <span class="sc-kw" id="scKw"></span>
    <span class="sc-hint">点击修改</span>
  </button>

  <aside class="sidebar" aria-label="站点侧栏">
    <input class="side-filter" id="sideFilter" type="search" placeholder="筛选站点…" autocomplete="off">
    <div class="side-list" id="sideList"></div>
    <div class="side-foot">
      <label class="toggle">
        <input type="checkbox" id="freeOnlySide"> 只看免费
      </label>
      <button class="ghost-btn" id="openAllSide">新窗口全开</button>
    </div>
  </aside>

  <div class="site-bar">
    <div class="site-strip" id="siteStrip" role="listbox" aria-label="站点列表"></div>
    <button type="button" class="more-btn" id="moreBtn" aria-expanded="false" aria-controls="morePanel">
      更多 <span class="caret" aria-hidden="true"></span>
    </button>
    <div class="more-panel" id="morePanel" hidden>
      <div class="sheet-head">
        <span>选择站点</span>
        <button type="button" class="sheet-close" id="closeMoreBtn" aria-label="关闭">×</button>
      </div>
      <input id="siteFilter" type="search" placeholder="筛选站点…" autocomplete="off">
      <div class="more-list" id="moreList"></div>
      <div class="more-foot">
        <label class="toggle" id="freeToggleWrap">
          <input type="checkbox" id="freeOnly"> 只看免费
        </label>
        <button class="ghost-btn" id="openAll">新窗口全开</button>
      </div>
    </div>
  </div>

  <section class="preview" id="preview" hidden aria-label="站点预览">
    <div class="preview-head">
      <div class="preview-title">
        <span class="pname" id="previewName"></span>
        <span class="preview-keyword" id="previewKeyword"></span>
        <span class="preview-status" id="previewStatus"></span>
      </div>
      <div class="preview-actions">
        <button type="button" id="reloadPreview">刷新</button>
        <button type="button" id="openExternal">新窗口</button>
        <button type="button" class="icon" id="toggleFull" title="全屏" aria-label="全屏">⤢</button>
        <button type="button" class="icon" id="closePreview" title="关闭" aria-label="关闭">×</button>
      </div>
    </div>
    <div class="preview-body">
      <iframe id="previewFrame" title="站点预览"></iframe>
      <div class="preview-loading" id="previewLoading">
        <span class="spinner"></span><span>正在加载站点…</span>
      </div>
      <div class="preview-blocked" id="previewBlocked" hidden>
        <p id="blockedText"></p>
        <button type="button" class="big" id="blockedOpen">在新窗口打开</button>
      </div>
    </div>
  </section>

  <div class="preview-empty" id="previewEmpty">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
      <circle cx="11" cy="11" r="7"></circle>
      <path d="m20 20-3.5-3.5"></path>
    </svg>
    <p>在左侧选择一个站点，搜索结果会显示在这里</p>
  </div>
</div>

<div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
// 内置站点清单（来自小红盒 search/get 接口的「网盘」分组）。
// {keyword} 会被替换成 encodeURIComponent 后的关键词。
const SITES = [
      { name: "盘搜吧",     tag: "免费", url: "https://www.panso678.com/search?keyword={keyword}&from=redbox" },
      { name: "聚盘搜",     tag: "免费", url: "https://www.panso567.com/search?keyword={keyword}&from=redbox" },
      { name: "小云搜索",   tag: "免费", url: "https://www.yunso.net/index/user/s?wd={keyword}&mode=90002&stype=0" },
      { name: "懒盘搜索",   tag: "免费", url: "https://www.lzpanx.com/search?q={keyword}" },
      { name: "阿里小站",   tag: "免费", url: "https://pan666.net/?q={keyword}", embed: false },
      { name: "兄弟盘",     tag: "免费", url: "https://xiongdipan.com/search?k={keyword}", embed: false },
      { name: "夸夸盘搜",   tag: "付费", url: "https://www.kuakuaso.com/search?keyword={keyword}&from=redbox" },
      { name: "盘大师",     tag: "付费", url: "https://www.pandashi8.com/search?keyword={keyword}&from=redbox" },
      { name: "盘了个盘",   tag: "付费", url: "https://www.panlegepan.com/s/{keyword}?from=redbox" },
      { name: "阿里搜",     tag: "付费", url: "https://aliso.cc/s/{keyword}-1-0.html" },
      { name: "UP云搜Pro+", tag: "",    url: "https://www.upyunso.com/search.html?keyword={keyword}&from=redbox" },
      { name: "混合盘",     tag: "",    url: "https://hunhepan.com/search?enabled=true&q={keyword}" },
      { name: "猫狸云搜",   tag: "",    url: "https://www.maoliyun.com/search?k={keyword}", embed: false },
      { name: "115网盘",    tag: "",    url: "https://panku8.com/s/{keyword}/5" },
      { name: "AQ网盘搜索", tag: "",    url: "https://ipanso.cc/search/?kw={keyword}", embed: false },
      { name: "帕卡搜索",   tag: "",    url: "https://www.cuppaso.com/search?type=2&keyword={keyword}&searchType=0&page=1" },
      { name: "皮卡搜索",   tag: "",    url: "https://www.pikasoo.top/search/?pan=all&q={keyword}", embed: false },
      { name: "搜网盘",     tag: "",    url: "https://www.swangpan.com/tag/{keyword}/" },
      { name: "夸克搜",     tag: "",    url: "https://qkpanso.com/search?q={keyword}" },
      { name: "迅雷网盘",   tag: "",    url: "https://www.cuppaso.com/search?type=1&keyword={keyword}&searchType=4&page=1" },
      { name: "奇乐搜",     tag: "",    url: "https://www.qileso.com/?s={keyword}", embed: false }
];

const LS_CUSTOM = "searcher.custom.sites";
const LS_RECENT = "searcher.recent.keywords";
const LS_LAST = "searcher.last.site";
const LS_FREE = "searcher.free.only";
const LS_UNLOCK = "searcher.unlocked";
// 访问密钥的 SHA-256（默认密钥：redbox2026）
const ACCESS_HASH = "36b56a31c41247564eb723ca09c621a65ed65dce1b5324b87951868cfc92ce30";

const $ = (id) => document.getElementById(id);
const kwInput = $("kw");
const headerEl = document.querySelector("header");
const searchbarEl = document.querySelector(".searchbar");
const searchCompact = $("searchCompact");
const scKw = $("scKw");
const sideFilter = $("sideFilter");
const sideList = $("sideList");
const previewEmpty = $("previewEmpty");
const sheetBackdrop = $("sheetBackdrop");
const siteStrip = $("siteStrip");
const moreBtn = $("moreBtn");
const morePanel = $("morePanel");
const moreList = $("moreList");
const siteFilter = $("siteFilter");
const recentEl = $("recent");
const toastEl = $("toast");
const freeOnlyInput = $("freeOnly");
const freeOnlySide = $("freeOnlySide");
const freeToggleWrap = $("freeToggleWrap");

function lsGet(key, fallback) {
  try {
    const value = localStorage.getItem(key);
    return value === null ? fallback : value;
  } catch (e) {
    return fallback;
  }
}

function lsSet(key, value) {
  try { localStorage.setItem(key, value); } catch (e) {}
}

function loadJSON(key, fallback) {
  try {
    const raw = lsGet(key, "");
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) {
    return fallback;
  }
}

function saveJSON(key, value) {
  lsSet(key, JSON.stringify(value));
}

let customSites = loadJSON(LS_CUSTOM, []).map((s) => ({ ...s, custom: true }));
let recentKeywords = loadJSON(LS_RECENT, []);
let lastSiteUrl = lsGet(LS_LAST, "");
let freeOnly = lsGet(LS_FREE, "0") === "1";
let selectedSite = null;
let previewKeyword = "";
let previewTimer = null;

function allSites() {
  return SITES.concat(customSites);
}

function visibleSites() {
  const list = allSites();
  if (!freeOnly) return list;
  return list.filter((s) => s.custom || s.tag === "免费");
}

function hostOf(url) {
  try { return new URL(url).host; } catch (e) { return url; }
}

function buildUrl(site, keyword) {
  return site.url.includes("{keyword}")
    ? site.url.replaceAll("{keyword}", encodeURIComponent(keyword))
    : site.url;
}

let toastTimer = null;
function toast(message) {
  toastEl.textContent = message;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1800);
}

function renderSites() {
  const list = visibleSites();
  siteStrip.innerHTML = "";

  if (!list.length) {
    const empty = document.createElement("span");
    empty.className = "empty-strip";
    empty.textContent = freeOnly ? "没有免费站点，关掉「只看免费」" : "还没有站点，点右上角 ＋ 添加";
    siteStrip.appendChild(empty);
  } else {
    list.forEach((site) => {
      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = "site-chip";
      chip.dataset.url = site.url;
      chip.title = site.name;
      if (selectedSite && selectedSite.url === site.url) chip.classList.add("active");

      if (site.tag === "免费" || site.tag === "付费") {
        const dot = document.createElement("span");
        dot.className = "dot " + (site.tag === "免费" ? "free" : "paid");
        chip.appendChild(dot);
      }

      const label = document.createElement("span");
      label.textContent = site.name;
      chip.appendChild(label);

      chip.addEventListener("click", () => previewSite(site));
      siteStrip.appendChild(chip);
    });
  }

  renderMoreList();
}

function buildSiteRow(site, onPick) {
  const item = document.createElement("button");
  item.type = "button";
  item.className = "more-item";
  if (selectedSite && selectedSite.url === site.url) item.classList.add("current");

  const main = document.createElement("span");
  main.className = "mi-main";

  const name = document.createElement("span");
  name.className = "mi-name";
  name.textContent = site.name;
  main.appendChild(name);

  const host = document.createElement("span");
  host.className = "mi-host";
  host.textContent = hostOf(site.url);
  main.appendChild(host);
  item.appendChild(main);

  if (site.tag === "免费" || site.tag === "付费") {
    const badge = document.createElement("span");
    badge.className = "badge " + (site.tag === "免费" ? "free" : "paid");
    badge.textContent = site.tag;
    item.appendChild(badge);
  }

  if (site.url === lastSiteUrl) {
    const last = document.createElement("span");
    last.className = "badge last";
    last.textContent = "上次";
    item.appendChild(last);
  }

  if (site.custom) {
    const del = document.createElement("button");
    del.type = "button";
    del.className = "del";
    del.textContent = "×";
    del.setAttribute("aria-label", "删除 " + site.name);
    del.addEventListener("click", (event) => {
      event.stopPropagation();
      customSites = customSites.filter((s) => s.name !== site.name || s.url !== site.url);
      saveJSON(LS_CUSTOM, customSites);
      if (selectedSite && selectedSite.url === site.url) {
        previewEl.hidden = true;
        previewFrame.src = "about:blank";
        selectedSite = null;
      }
      render();
      toast("已删除");
    });
    item.appendChild(del);
  }

  item.addEventListener("click", onPick);
  return item;
}

function renderSideList() {
  const list = visibleSites();
  const query = sideFilter.value.trim().toLowerCase();
  const filtered = query
    ? list.filter((s) => (s.name + " " + hostOf(s.url)).toLowerCase().includes(query))
    : list;

  sideList.innerHTML = "";

  if (!filtered.length) {
    const empty = document.createElement("div");
    empty.className = "empty-strip";
    empty.textContent = query
      ? "没有匹配的站点"
      : (freeOnly ? "没有免费站点，关掉「只看免费」" : "还没有站点，点右上角 ＋ 添加");
    sideList.appendChild(empty);
    return;
  }

  filtered.forEach((site) => {
    sideList.appendChild(buildSiteRow(site, () => previewSite(site)));
  });
}

function renderMoreList() {
  const list = visibleSites();
  const query = siteFilter.value.trim().toLowerCase();
  const filtered = query
    ? list.filter((s) => (s.name + " " + hostOf(s.url)).toLowerCase().includes(query))
    : list;

  moreList.innerHTML = "";

  if (!filtered.length) {
    const empty = document.createElement("div");
    empty.className = "empty-strip";
    empty.textContent = query ? "没有匹配的站点" : "没有站点";
    moreList.appendChild(empty);
    return;
  }

  filtered.forEach((site) => {
    moreList.appendChild(buildSiteRow(site, () => {
      closeMore();
      previewSite(site);
    }));
  });
}

function openMore() {
  morePanel.hidden = false;
  sheetBackdrop.hidden = false;
  document.body.classList.add("sheet-lock");
  moreBtn.setAttribute("aria-expanded", "true");
  siteFilter.value = "";
  renderMoreList();
  moreList.scrollTop = 0;
  if (window.matchMedia("(min-width: 561px)").matches) siteFilter.focus();
}

function closeMore() {
  morePanel.hidden = true;
  sheetBackdrop.hidden = true;
  document.body.classList.remove("sheet-lock");
  moreBtn.setAttribute("aria-expanded", "false");
  siteFilter.value = "";
}

function toggleMore() {
  if (morePanel.hidden) openMore();
  else closeMore();
}

function centerChip(chip) {
  const left = chip.offsetLeft - (siteStrip.clientWidth - chip.offsetWidth) / 2;
  siteStrip.scrollTo({ left: Math.max(0, left), behavior: "smooth" });
}

function renderToolbar() {
  freeOnlyInput.checked = freeOnly;
  freeOnlySide.checked = freeOnly;
}

function syncPreviewEmpty() {
  previewEmpty.hidden = !previewEl.hidden;
}

function setSearchCompact(on) {
  searchbarEl.hidden = on;
  headerEl.hidden = on;
  recentEl.hidden = on;
  searchCompact.hidden = !on;
  if (on) scKw.textContent = kwInput.value.trim();
}

function renderRecent() {
  recentEl.innerHTML = "";
  recentKeywords.forEach((keyword) => {
    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = "chip";
    chip.textContent = keyword;
    chip.addEventListener("click", () => {
      kwInput.value = keyword;
      searchPreferred();
    });
    recentEl.appendChild(chip);
  });
  if (recentKeywords.length) {
    const clear = document.createElement("button");
    clear.type = "button";
    clear.className = "chip clear";
    clear.textContent = "清除";
    clear.addEventListener("click", () => {
      recentKeywords = [];
      saveJSON(LS_RECENT, recentKeywords);
      renderRecent();
    });
    recentEl.appendChild(clear);
  }
}

function render() {
  renderToolbar();
  renderSites();
  renderSideList();
  syncPreviewEmpty();
}

function rememberKeyword(keyword) {
  if (!keyword) return;
  recentKeywords = [keyword, ...recentKeywords.filter((k) => k !== keyword)].slice(0, 8);
  saveJSON(LS_RECENT, recentKeywords);
  renderRecent();
}

const previewEl = $("preview");
const previewFrame = $("previewFrame");
const previewLoading = $("previewLoading");
const previewBlocked = $("previewBlocked");
const previewStatus = $("previewStatus");

function previewSite(site) {
  const keyword = kwInput.value.trim();

  if (site.url.includes("{keyword}") && !keyword) {
    kwInput.focus();
    toast("先输入关键词");
    return;
  }

  selectedSite = site;
  lastSiteUrl = site.url;
  lsSet(LS_LAST, lastSiteUrl);
  rememberKeyword(keyword);
  showPreview(site, keyword);
  render();
  setSearchCompact(true);
  const chip = siteStrip.querySelector(".site-chip.active");
  if (chip) centerChip(chip);
}

function showPreview(site, keyword) {
  previewKeyword = keyword;
  previewEl.hidden = false;
  $("previewName").textContent = site.name;
  $("previewKeyword").textContent = keyword ? "· " + keyword : "";
  previewStatus.textContent = "";

  if (site.embed === false) {
    previewFrame.src = "about:blank";
    previewFrame.hidden = true;
    previewLoading.hidden = true;
    previewBlocked.hidden = false;
    $("blockedText").textContent = "该站点禁止被其他页面嵌入，只能在浏览器新窗口里打开。";
    return;
  }

  previewBlocked.hidden = true;
  loadPreview(site, keyword);
}

function loadPreview(site, keyword) {
  clearTimeout(previewTimer);
  previewFrame.hidden = false;
  previewLoading.hidden = false;
  previewStatus.textContent = "加载中…";
  previewFrame.src = buildUrl(site, keyword);

  previewTimer = setTimeout(() => {
    if (previewLoading.hidden) return;
    previewStatus.textContent = "加载较慢，若一直空白请点「新窗口」";
  }, 12000);
}

previewFrame.addEventListener("load", () => {
  const src = previewFrame.getAttribute("src");
  if (!src || src === "about:blank") return;
  previewLoading.hidden = true;
  clearTimeout(previewTimer);
  previewStatus.textContent = "";
});

function preferredSite(list) {
  return list.find((s) => s.url === lastSiteUrl) || list[0];
}

function searchPreferred() {
  if (selectedSite) {
    previewSite(selectedSite);
    return;
  }

  const list = visibleSites();
  if (!list.length) {
    kwInput.focus();
    toast("没有可用站点");
    return;
  }
  previewSite(preferredSite(list));
}

function openAll() {
  const keyword = kwInput.value.trim();
  if (!keyword) {
    kwInput.focus();
    toast("先输入关键词");
    return;
  }

  const list = visibleSites().filter((s) => s.url.includes("{keyword}"));
  if (!list.length) {
    toast("没有可搜索的站点");
    return;
  }

  let opened = 0;
  let blocked = 0;
  list.forEach((site) => {
    const win = window.open(buildUrl(site, keyword), "_blank", "noopener,noreferrer");
    if (win) opened += 1; else blocked += 1;
  });

  if (opened) {
    lastSiteUrl = list[0].url;
    lsSet(LS_LAST, lastSiteUrl);
    rememberKeyword(keyword);
    renderSites();
  }
  toast(blocked ? `已打开 ${opened} 个，${blocked} 个被浏览器拦截` : `已打开 ${opened} 个`);
}

kwInput.addEventListener("keydown", (event) => {
  if (event.key !== "Enter") return;
  event.preventDefault();
  searchPreferred();
});

$("go").addEventListener("click", searchPreferred);
$("openAll").addEventListener("click", openAll);

searchCompact.addEventListener("click", () => {
  setSearchCompact(false);
  kwInput.focus();
  kwInput.select();
  window.scrollTo({ top: 0, behavior: "smooth" });
});

moreBtn.addEventListener("click", (event) => {
  event.stopPropagation();
  toggleMore();
});

siteFilter.addEventListener("input", renderMoreList);

document.addEventListener("click", (event) => {
  if (morePanel.hidden) return;
  if (!event.target.closest(".site-bar")) closeMore();
});

function openExternal() {
  if (!selectedSite) return;
  const keyword = kwInput.value.trim() || previewKeyword;
  window.open(buildUrl(selectedSite, keyword), "_blank", "noopener,noreferrer");
}

function setFullscreen(on) {
  previewEl.classList.toggle("fullscreen", on);
  document.body.classList.toggle("preview-lock", on);
  $("toggleFull").textContent = on ? "⤡" : "⤢";
  $("toggleFull").setAttribute("aria-label", on ? "退出全屏" : "全屏");
}

function closePreview() {
  setFullscreen(false);
  previewEl.hidden = true;
  previewFrame.src = "about:blank";
  selectedSite = null;
  setSearchCompact(false);
  render();
}

$("reloadPreview").addEventListener("click", () => {
  if (!selectedSite) return;
  if (selectedSite.embed === false) { toast("该站点只能新窗口打开"); return; }
  previewKeyword = kwInput.value.trim();
  $("previewKeyword").textContent = previewKeyword ? "· " + previewKeyword : "";
  loadPreview(selectedSite, previewKeyword);
});

$("openExternal").addEventListener("click", openExternal);
$("blockedOpen").addEventListener("click", openExternal);
$("closePreview").addEventListener("click", closePreview);
$("toggleFull").addEventListener("click", () => {
  setFullscreen(!previewEl.classList.contains("fullscreen"));
});

kwInput.addEventListener("input", () => {
  if (!selectedSite || previewEl.hidden) return;
  const kw = kwInput.value.trim();
  previewStatus.textContent = kw !== previewKeyword
    ? "关键词已变更，点「刷新」重新搜索"
    : "";
});

function setFreeOnly(value) {
  freeOnly = value;
  lsSet(LS_FREE, freeOnly ? "1" : "0");
  freeOnlyInput.checked = freeOnly;
  freeOnlySide.checked = freeOnly;
  renderSites();
  renderSideList();
}

freeOnlyInput.addEventListener("change", (event) => {
  setFreeOnly(event.target.checked);
});

freeOnlySide.addEventListener("change", (event) => {
  setFreeOnly(event.target.checked);
});

sideFilter.addEventListener("input", renderSideList);
$("openAllSide").addEventListener("click", openAll);
sheetBackdrop.addEventListener("click", closeMore);
$("closeMoreBtn").addEventListener("click", closeMore);

window.addEventListener("resize", () => {
  if (window.matchMedia("(min-width: 900px)").matches && !morePanel.hidden) closeMore();
});

document.addEventListener("keydown", (event) => {
  const tag = (document.activeElement && document.activeElement.tagName) || "";
  const typing = tag === "INPUT" || tag === "TEXTAREA";

  if (event.key === "/" && !typing) {
    event.preventDefault();
    kwInput.focus();
    return;
  }
  if (event.key === "Escape") {
    if (previewEl.classList.contains("fullscreen")) setFullscreen(false);
    else if (!morePanel.hidden) closeMore();
    else if (document.activeElement === kwInput) kwInput.blur();
  }
});

function initApp() {
  renderRecent();
  render();
}

async function sha256Hex(text) {
  const data = new TextEncoder().encode(text);
  const digest = await crypto.subtle.digest("SHA-256", data);
  return Array.from(new Uint8Array(digest), (b) => b.toString(16).padStart(2, "0")).join("");
}

async function unlock() {
  const value = $("gateKey").value.trim();
  if (!value) { $("gateErr").textContent = "请输入密钥"; return; }

  let hash = "";
  try {
    hash = await sha256Hex(value);
  } catch (e) {
    $("gateErr").textContent = "当前环境无法校验，请用 https 打开";
    return;
  }

  if (hash !== ACCESS_HASH) {
    $("gateErr").textContent = "密钥不正确";
    $("gateKey").select();
    return;
  }

  lsSet(LS_UNLOCK, "1");
  document.documentElement.classList.add("unlocked");
  initApp();
}

$("gateBtn").addEventListener("click", unlock);
$("gateKey").addEventListener("keydown", (event) => {
  if (event.key === "Enter") unlock();
});

if (lsGet(LS_UNLOCK, "") === "1") {
  document.documentElement.classList.add("unlocked");
  initApp();
}

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
